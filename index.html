<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>手札</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="手札">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F6F6">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Design: 試して・振り返る・形を変える。Figma 画面案(390×844)に合わせたスマホアプリ。単一の明るい配色(意図的にダーク対応なし)。 */
:root{
  --bg:#F6F6F6; --outer:#2B2A36; --ink:#3B3A4A; --ink2:#4A4858; --muted:#6B6877; --ph:#A39FAB; --line:#5B5870;
  --chip:#F1ECE6; --bd:#E3D6CC; --bd2:#D9D0C8; --bd3:#F1E3DA; --bd4:#EADFD8;
  --selbg:#FFF0EA; --selbd:#E8907A; --req:#F4AE98; --dis:#EDE6E0; --disx:#8A8591;
  --o1:#E55C00; --o2:#EA7B0C; --ok:#D5EEE0; --ng:#DEDCFA; --note:#F7F2EC;
  --exercise1:#DF5844; --exercise2:#FFA396; --exercise-sh:247,96,52;
  --meal1:#488D64; --meal2:#A0D2B3; --meal-sh:112,190,76;
  --sleep1:#0D8FC3; --sleep2:#59B0D3; --sleep-sh:13,143,194;
  --other1:#9B4EAA; --other2:#B165BC; --other-sh:155,78,170;
  --gx:max(20px, env(safe-area-inset-left,0px)); --gx2:max(20px, env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--outer)}
body{margin:0;font-family:'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans',sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:var(--ink)}
img{display:block;max-width:none}
#app{position:relative;max-width:430px;margin:0 auto;min-height:100vh;overflow-x:clip;background:var(--bg);box-shadow:0 0 40px rgba(0,0,0,.35)}
.screen{padding-left:var(--gx);padding-right:var(--gx2);padding-bottom:150px;min-height:100vh;position:relative}
.screen[data-screen=setup]{padding-bottom:210px}
.screen.fwd{animation:inR .24s ease-out}
.screen.bk{animation:inL .24s ease-out}
@keyframes inR{from{opacity:.4;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:.4;transform:translateX(-28px)}to{opacity:1;transform:none}}
.nav{display:flex;justify-content:space-between;align-items:center;height:44px;padding-top:0;margin-top:24px;position:relative;z-index:2}
.back{width:44px;height:44px;margin-left:-12px;display:flex;align-items:center;justify-content:center}
.navr{font-size:13px;font-weight:700;color:var(--muted)}
.pill-day{background:var(--chip);color:var(--ink);border-radius:14px;padding:3px 14px;font-size:13px;font-weight:700;line-height:21px}
h1{margin:0;font-weight:700;letter-spacing:.01em}
.h22{font-size:22px;line-height:32px;margin-top:8px}
.h24{font-size:24px;line-height:34px;margin-top:6px}
.h26{font-size:26px;line-height:36px;margin-top:6px}
.h28{font-size:28px;line-height:38px;margin-top:14px}
.sub{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:23px}
.foot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);padding:0 var(--gx2) calc(24px + env(safe-area-inset-bottom,0px)) var(--gx);z-index:20}
.foot.bar{background:var(--bg);border-top:1px solid var(--bd4);padding-top:20px}
.foot .stack{display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:56px;border-radius:28px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(180deg,var(--o1),var(--o2));transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.off{background:var(--dis);color:var(--disx);pointer-events:none}
.btn.sec{background:#fff;color:var(--ink);border:2px solid var(--bd);height:52px;font-size:16px}
.btn.sm{height:44px;font-size:15px;border:2px solid var(--bd);background:#fff;color:var(--ink)}
.link{display:block;margin:0 auto;text-align:center;font-size:14px;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:8px}
.hr-gap{height:18px}
/* chips */
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{height:42px;min-width:52px;padding:0 11px;border-radius:21px;border:2px solid var(--c,var(--o1));color:var(--c,var(--o1));background:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:background .12s}
.chip.on{background:var(--c,var(--o1));color:#fff}
.chip.all{--c:var(--o1)}
.chip.exercise{--c:var(--exercise1)}.chip.meal{--c:var(--meal1)}.chip.sleep{--c:var(--sleep1)}.chip.other{--c:var(--other1)}
/* option cards */
.opt{border:2px solid var(--bd);background:#fff;border-radius:24px;position:relative;width:100%}
.opt.on{background:var(--selbg);border-color:var(--selbd)}
.opt .tick{position:absolute;right:-6px;top:-10px;width:29px;height:29px;border-radius:50%;background:var(--selbd);display:none;align-items:center;justify-content:center}
.opt.on .tick{display:flex}
.badge{display:inline-block;border-radius:12px;padding:0 10px;height:24px;line-height:24px;font-size:11px;font-weight:700;background:var(--chip);color:var(--ink);vertical-align:middle}
.badge.req{background:var(--req)}
/* inputs */
.field{display:block;width:100%;height:46px;border-radius:23px;border:2px solid var(--bd);background:#fff;padding:0 18px;font-size:15px;outline:none}
.field::placeholder{color:var(--ph)}
.field:focus{border-color:var(--selbd)}
.lbl{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin:0 0 10px}
.panel{background:#fff;border:2px solid var(--bd2);border-radius:30px;padding:16px 18px 20px}
.panel .lbl{margin-top:20px}
.panel .lbl:first-child{margin-top:0}
.chips4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.chips4 .chip{min-width:0;width:100%}
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts2 .chip{width:100%;border-color:var(--bd);color:var(--ink)}
.opts2 .chip.on{background:var(--selbg);border-color:var(--selbd);color:var(--ink)}
/* slots */
.slots{display:flex;gap:10.4px;margin-top:10px}
.slot{width:59px;height:42px;border-radius:12px;border:2px dashed #BDB5C4;background:#fff;flex:none}
.slot.f{border:0;background:var(--c1);box-shadow:inset 0 0 0 3px #fff, 0 0 0 1px var(--bd4)}
/* card */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 max(0px,calc(var(--gx) - 20px)) 0 0}
.cardwrap{position:relative}
.card{position:relative;display:block;width:100%;height:196px;border-radius:24px;background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:3px 3px 7px rgba(var(--sh),.37);color:#fff;transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.card:active{transform:scale(.97)}
.card .hd{position:absolute;left:0;top:0;right:0;height:29px;padding:6px 0 0 13px;font-size:12px;font-weight:700;line-height:20px}
.card .bd{position:absolute;left:5px;right:5px;top:29px;bottom:5px;background:#fff;border-radius:20px;color:var(--ink);padding:0 10px}
.card .ico{position:absolute;left:0;right:0;top:15px;height:43px;display:flex;align-items:center;justify-content:center}
.card .ttl{position:absolute;left:10px;right:8px;top:75px;font-size:13px;font-weight:700;line-height:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .tg{position:absolute;left:10px;bottom:10px}
.tag{display:inline-block;height:20px;line-height:20px;border-radius:10px;padding:0 10px;font-size:11px;background:var(--chip);color:var(--ink);font-weight:400;white-space:nowrap}
.card.sel{z-index:2}
.card.sel.r0{transform:rotate(-3deg) scale(1.01)}
.card.sel.r1{transform:rotate(3deg) scale(1.01)}
.chk{position:absolute;right:-4px;top:-6px;width:30px;height:30px;border-radius:50%;background:var(--ink);display:none;align-items:center;justify-content:center;z-index:3;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.cardwrap.sel .chk{display:flex}
.cat-exercise{--c1:var(--exercise1);--c2:var(--exercise2);--sh:var(--exercise-sh)}
.cat-meal{--c1:var(--meal1);--c2:var(--meal2);--sh:var(--meal-sh)}
.cat-sleep{--c1:var(--sleep1);--c2:var(--sleep2);--sh:var(--sleep-sh)}
.cat-other{--c1:var(--other1);--c2:var(--other2);--sh:var(--other-sh)}
/* home */
.dayrow{display:flex;align-items:center;gap:4px;margin-left:-10px}
.dbtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.dbtn.r svg{transform:scaleX(-1)}
.dbtn[disabled]{opacity:.25;pointer-events:none}
.dayof{font-size:12px;color:var(--muted);margin-left:8px}
.codebox{display:block;width:100%;height:200px;margin-top:16px;border:2px solid var(--bd);border-radius:18px;padding:12px;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--ink);background:#fff;word-break:break-all;resize:none}
.hello{font-size:13px;color:var(--muted);margin-top:0;line-height:18px}
.band{display:block;width:100%;margin-top:14px;border-radius:28px;padding:16px 18px 14px;background:linear-gradient(180deg,var(--o1),var(--o2));color:#fff;box-shadow:3px 3px 7px rgba(91,144,150,.37);position:relative;min-height:93px}
.band .t{font-size:20px;font-weight:700;line-height:28px}
.band .s{font-size:13px;line-height:18px;margin-top:4px;padding-right:40px}
.band .ch{position:absolute;right:20px;top:50%;transform:translateY(-50%)}
.msg{margin-top:14px;font-size:13px;color:var(--muted);line-height:20px;padding:12px 4px}
.shead{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 14px}
.shead .l{font-size:20px;font-weight:700}
.shead .l span{font-size:14px;color:var(--muted);font-weight:400;margin-left:8px}
.shead .r{font-size:12px;color:var(--muted)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(36px + env(safe-area-inset-bottom,0px));width:184px;height:58px;border-radius:29px;background:linear-gradient(180deg,var(--o1),var(--o2));color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:3px 3px 7px rgba(255,156,35,.5);z-index:20}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:13px;padding:40px 0}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:10px 18px;border-radius:20px;z-index:60;animation:toast 2.2s ease forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}12%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
/* welcome */
.rain{position:absolute;left:0;right:0;top:0;height:100vh;overflow:hidden;pointer-events:none;z-index:0}
.rain img{position:absolute;top:-80px;opacity:.9;animation:fall linear infinite;will-change:transform}
@keyframes fall{from{transform:translateY(0) rotate(var(--r0))}to{transform:translateY(calc(100vh + 160px)) rotate(var(--r1))}}
.static-rain img{animation:none;top:var(--y)}
.welcome-in{position:relative;z-index:1;padding-top:240px}
.welcome-in h1{font-size:36px;line-height:46px;color:var(--o1);font-weight:700}
.welcome-in .sub{font-size:16px;margin-top:10px}
.welcome-in .field{border-color:var(--o1);height:54px;border-radius:27px;margin-top:6px}
.welcome-in .field::placeholder{color:var(--o1);opacity:.85}
.note{font-size:12px;color:var(--muted);margin:10px 0 0 4px}
/* hints (03) */
.hintrow{display:flex;align-items:center;gap:12px;width:fit-content;max-width:calc(100% + 4px);min-height:76px;margin:0 0 24px -4px;border-radius:38px;background:#fff;padding:12px 22px 12px 14px;box-shadow:0 6px 14px rgba(240,160,120,.3);font-size:16px;font-weight:700;line-height:23px}
/* adjust rows */
.arow{display:flex;align-items:center;gap:11px;padding:0 14px;min-height:65px;border-radius:24px;margin-bottom:9px;text-align:left}
.arow .ic{width:42px;height:42px;display:flex;align-items:center;justify-content:center;flex:none}
.arow .tt{font-size:15px;font-weight:700;line-height:21px}
.arow .dd{font-size:12px;line-height:18px}
.arow.plain{padding:12px 16px;display:block}
/* daytype (06) */
.dtcard{display:flex;align-items:center;gap:34px;height:174px;border-radius:30px;background:#fff;border:2px solid var(--bd3);padding:0 28px 0 34px;margin-top:18px;width:100%;text-align:left;transition:transform .12s}
.dtcard:active{transform:scale(.98)}
.dtcard .face{width:70px;height:70px;flex:none;display:flex;align-items:center;justify-content:center}
.dtcard .t{font-size:22px;font-weight:700;line-height:30px}
.dtcard .d{font-size:13px;line-height:22px;color:var(--ink2);margin-top:6px}
/* bottom bar count */
.barrow{display:flex;align-items:center;justify-content:space-between;gap:16px}
.barrow .cnt{flex:none}
.barrow .cnt .a{font-size:12px;color:var(--muted);line-height:16px}
.barrow .cnt .b{font-size:22px;font-weight:700;line-height:30px}
.barrow .btn{width:210px;flex:none}
/* plan (10) */
.pcard{display:block;width:100%;height:134px;border-radius:28px;background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:3px 3px 7px rgba(var(--sh),.37);position:relative;margin-top:14px;color:#fff}
.pcard .hd{padding:6px 0 0 18px;font-size:12px;font-weight:700;line-height:20px;height:31px}
.pcard .bd{position:absolute;left:5px;right:5px;top:31px;bottom:5px;background:#fff;border-radius:24px;color:var(--ink);display:flex;align-items:center;padding:0 24px 0 28px;gap:28px}
.pcard .ico{width:43px;height:43px;flex:none;display:flex;align-items:center;justify-content:center}
.pcard .tt{font-size:20px;font-weight:700;line-height:28px;margin-bottom:6px}
.pcard.done{opacity:.55}
/* record */
.tcard{display:flex;align-items:center;gap:20px;height:74px;border-radius:28px;background:#fff;border:4px solid var(--c1);padding:0 22px;margin-top:12px}
.tcard .ico{width:42px;height:42px;display:flex;align-items:center;justify-content:center;flex:none}
.tcard .a{font-size:12px;font-weight:700;color:var(--muted);line-height:16px}
.tcard .b{font-size:16px;font-weight:700;line-height:22px}
.qrow{display:flex;gap:12px;align-items:flex-start;margin-top:22px}
.qrow h2{margin:0;font-size:17px;line-height:25px;font-weight:700}
.fitgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.fit{height:102px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:17px;font-weight:700}
.fit .fi{height:34px;display:flex;align-items:center;justify-content:center}
.fixbox{margin-top:16px;background:var(--chip);border-radius:24px;padding:14px 14px 14px}
.fixbox .p{font-size:14px;font-weight:700;margin:2px 0 10px 4px;line-height:20px}
.h2{display:flex;align-items:center;gap:8px;margin:26px 0 2px;font-size:16px;font-weight:700;line-height:24px}
.h2s{font-size:12px;color:var(--muted);margin:0 0 10px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ropt{border-radius:18px;padding:12px 14px;border:2px solid var(--bd);background:#fff;text-align:left}
.ropt.on{background:var(--selbg);border-color:var(--selbd)}
.ropt .tt{font-size:14px;font-weight:700;line-height:20px}
.ropt .dd{font-size:12px;line-height:17px;margin-top:3px}
.hint-all{margin-top:22px;margin-bottom:8px}
/* card detail (12) */
.flipwrap{perspective:1000px;margin:26px auto 0;width:310px;max-width:100%;height:470px}
.flipper{position:relative;width:100%;height:100%;transition:transform .48s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.flipper.on{transform:rotateY(180deg)}
.face-side{position:absolute;inset:0;border-radius:38px;background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:3px 3px 7px rgba(var(--sh),.37);backface-visibility:hidden;-webkit-backface-visibility:hidden;color:#fff;overflow:hidden}
.face-side.rear{transform:rotateY(180deg)}
.face-side .hd{height:36px;padding:9px 0 0 22px;font-size:14px;font-weight:700;line-height:22px}
.face-side .bd{position:absolute;left:6px;right:6px;top:36px;bottom:6px;background:#fff;border-radius:32px;color:var(--ink);padding:0 24px;overflow:hidden}
.bigico{height:140px;display:flex;align-items:center;justify-content:center;margin-top:28px}
.bigttl{font-size:26px;font-weight:700;line-height:36px;margin-top:6px;min-height:72px}
.dash{border-top:2px dashed var(--bd2);margin:20px 0 14px}
.meta .k{font-size:13px;color:var(--muted);line-height:20px;margin-top:8px}
.meta .v{font-size:15px;font-weight:700;line-height:24px;margin-top:4px}
.meta .tag{height:26px;line-height:26px;font-size:14px;font-weight:700;border-radius:13px;padding:0 14px}
.logs{height:100%;overflow-y:auto;padding:14px 0 18px}
.logs .bt{font-size:17px;font-weight:700;line-height:24px;padding:0 2px}
.logrow{border:2px solid var(--bd4);border-radius:18px;padding:8px 12px;margin-top:8px}
.logrow .l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);line-height:24px}
.logrow .pl{display:inline-block;height:21px;line-height:21px;border-radius:11px;padding:0 10px;font-size:13px;font-weight:700;color:var(--ink)}
.logrow .l2{font-size:13px;line-height:19px;margin-top:2px;color:var(--ink)}
.origin{margin-top:12px;background:var(--note);border-radius:18px;padding:12px 14px}
.origin .a{font-size:12px;font-weight:700;color:var(--muted)}
.origin .b{font-size:15px;font-weight:700;line-height:22px;margin-top:2px}
.origin .c{font-size:13px;line-height:19px;margin-top:4px}
.nolog{font-size:13px;color:var(--muted);text-align:center;padding:30px 0}
.flipbtn{display:flex;margin:14px auto 0;width:220px;height:51px;border-radius:26px;border:2px solid var(--bd);background:#fff;align-items:center;justify-content:center;font-size:17px;font-weight:700}
/* debug */
.dbg{position:fixed;inset:0;background:rgba(40,38,52,.55);z-index:90;display:flex;align-items:flex-end;justify-content:center}
.dbg .box{width:min(100%,430px);max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:20px var(--gx2) calc(24px + env(safe-area-inset-bottom,0px)) var(--gx);font-size:13px;color:var(--muted)}
.dbg h3{margin:0 0 4px;font-size:15px;color:var(--ink)}
.dbg .row{display:flex;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap}
.dbg button.b{border:1px solid var(--bd2);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--ink);background:#fff}
.dbg button.b.dg{color:#B3261E;border-color:#E5B5B1}
.dbg textarea{width:100%;height:120px;font:12px/1.4 ui-monospace,monospace;border:1px solid var(--bd2);border-radius:10px;padding:8px;color:var(--ink)}
.dbg .num{font-size:20px;font-weight:700;color:var(--ink);min-width:48px;text-align:center}
@media (prefers-reduced-motion:reduce){.screen.fwd,.screen.bk{animation:none}.rain img{animation:none}.flipper{transition:none}.toast{animation-duration:.01s}}

/* ===== v7 追加分 ===== */
html,body{background:var(--outer)}
.screen{padding-bottom:150px}
.screen.hastab{padding-bottom:240px}
.screen.blue{--o1:#1C3F9C;--o2:#4B88E6}
.screen.blue .btn.sec,.screen.blue .btn.sm{color:var(--ink)}
.cards{gap:28px 16px}
.cards.tight{gap:12px;margin-top:22px;padding-top:6px}
/* tab bar */

  var m=t.match(/k2:/i);
  if(!m)throw new Error('prefix');
  t=t.slice(m.index+3).replace(/-/g,'+').replace(/_/g,'/');
  while(t.length%4)t+='=';
  var j=decodeURIComponent(escape(atob(t)));
  var o=JSON.parse(j);if(!o||!o.d||!Array.isArray(o.d.cards))throw new Error('data');
  var b=blank();for(var q in b){if(o.d[q]!==undefined)b[q]=o.d[q];}
  return b;
}

  if(!isToday)h+='<div class="notday"><span>'+(VIEW?'この人が最後に開いたのは、'+rn+'日目です。':'今日ではありません。'+(isPast?'これまでの':'これからの')+'様子です。')+'</span>'+(VIEW?'<button data-a="day-today">'+rn+'日目へ</button>':'<button data-a="day-today">今日にもどる</button>')+'</div>';
  var canEdit=isToday&&!VIEW;
  // 昨日の分(睡眠カード)
  if(isToday&&rn>=2){
    var y=peek(rn-1);
    var yl=y.selected.filter(function(id){var c=cardById(id);return c&&c.category==='sleep'&&y.logged.indexOf(id)<0;});
    if(yl.length){
      h+='<div class="sub2">昨日の分(睡眠のカードは、朝に記録できます)</div>'+yl.map(function(id){return trowHTML(cardById(id),y,rn-1,false,true);}).join('');
    }
  }
  // 1日目
  if(vd===1){
    h+='<div class="infobox"><b>1日目は、カードをつくる日です。</b><br>取り組むのは、2日目からです。'+(isToday&&!VIEW?'<br>カードは、ここから足せます。':'')+'</div>';
    if(canEdit)h+='<button class="addrow" style="margin-top:14px" data-a="new-card">'+PLUSO+'カードをつくる</button>';
  }else{
    var n=e.selected.length,k=e.selected.filter(function(id){return e.logged.indexOf(id)>=0;}).length;
    var progH='',ansH='',bodyH='';
    if(n&&!e.rested){
      progH='<div class="prog"><div class="t"><b><em>'+k+'</em>/'+n+' 記録ずみ</b><span>'+(k===n?'この日の分は、終わりです':isFut?'予定です':'寝る前に記録しましょう')+'</span></div><div class="bar">'+e.selected.map(function(id){return '<i class="'+(e.logged.indexOf(id)>=0?'on':'')+'"></i>';}).join('')+'</div></div>';
    }
    // 今日の日(答え)
    if(e.dayType){
      ansH='<div class="sub2">'+(isToday?'今日':vd+'日目')+'の日</div>'+
        '<div class="dayans">'+img('daytype_'+e.dayType)+'<div style="flex:1"><div class="t">'+DT[e.dayType]+'</div><div class="s">'+(isToday?'ホームで選んだ答えです':'選んだ答えです')+'</div></div>'+(canEdit?'<button class="chg" data-a="ask-today">変える</button>':'')+'</div>';
    }else if(canEdit){
      ansH='<button class="dayans ask" style="margin-top:16px" data-a="ask-today"><span><div class="t">今日はどんな日ですか？</div><div class="s">選ぶと、合うカードが先に並びます</div></span>'+CHEVR+'</button>';
    }else{
      ansH='<div class="infobox">この日の「どんな日か」は、まだ選ばれていません。</div>';
    }
    if(e.rested){
      bodyH='<div class="infobox warn" style="margin-top:14px"><b>'+(isToday?'今日':vd+'日目')+'はお休みにしました。</b>'+(canEdit?'<br><button data-a="ask-today">やっぱりカードを選ぶ</button>':'')+'</div>';
    }else if(n){
      bodyH='<div class="sub2">'+(isToday?'今日やること':vd+'日目に選んだカード')+'</div>'+e.selected.map(function(id){return trowHTML(cardById(id),e,vd,isFut,false);}).join('');
    }else if(e.dayType&&canEdit){
      bodyH='<div class="infobox" style="margin-top:14px">まだカードを選んでいません。</div><button class="btn" style="margin-top:14px" data-a="ask-pick">カードを選ぶ</button>';
    }
    h+=progH+ansH+bodyH;
    if(canEdit&&e.dayType&&!e.rested&&n)h+='<button class="addrow" data-a="ask-pick">'+PLUSO+'今日のカードを足す</button>';
  }
  // 明日の分
  if(isToday&&rn<TOTAL&&!VIEW&&dateKey()>=startDate()){
    if(tomorrow.dayType||tomorrow.rested){
      var tsel=tomorrow.selected.map(function(id){var c=cardById(id);return c?'<span>'+img('category_'+c.category)+'</span>':'';}).join('');
      h+='<button class="tmrcard done" data-a="ask-tmr">'+MOON+'<div style="flex:1"><div class="t">'+(tomorrow.rested?'明日はお休みにします':'明日の分:'+tomorrow.selected.length+'枚 選びました')+'</div><div class="s">'+(tomorrow.dayType?'明日は'+DT[tomorrow.dayType]:'')+'</div>'+(tsel?'<div class="mini">'+tsel+'</div>':'')+'</div><span class="chg2">変える</span></button>';
    }else{
      h+='<button class="tmrcard" data-a="ask-tmr">'+MOON+'<div><div class="t">明日の分を選ぶ</div><div class="s">夜のうちに明日のカードを<br>選んでおくこともできます</div></div></button>';
    }
  }
  if(VIEW&&vd>=2){/* 閲覧時は、明日の分の状況も見せる */
    var nx=vd<TOTAL?peek(vd+1):null;
    if(nx&&(nx.dayType||nx.rested)&&!isFut){
      h+='<div class="sub2">この日の夜に選んだ「明日の分」</div><div class="infobox">'+(nx.rested?'明日はお休み':'明日は'+DT[nx.dayType]+' / '+nx.selected.length+'枚')+'</div>';
    }
  }
  if(!VIEW&&isToday){
    if(rn>=4&&!(S.flags&&S.flags.b4)&&rn<TOTAL)h+='<div class="infobox warn"><b>ここまでの記録を、バックアップしましょう。</b><br>万が一の時に備えて、一度だけお願いします。<br><button data-a="backup-open">バックアップをとる</button></div>';
    if(rn===TOTAL)h+='<div class="infobox warn"><b>最終日です。おつかれさまです。</b><br>最後に、記録のバックアップを送ってください。<br><button data-a="finish-open">おわりの画面へ</button></div>';
    h+='<div style="display:flex;gap:22px;justify-content:center;margin-top:26px"><button class="link" style="margin:0;font-size:13px;font-weight:400" data-a="backup-open">記録をバックアップする</button><button class="link" style="margin:0;font-size:13px;font-weight:400" data-a="tut-open">使い方を見る</button></div>';
  }
  return vbar()+head+h+tabbar('today');
};
function trowHTML(c,e,dn,isFut,yest){
  if(!c)return '';
  var logged=e.logged.indexOf(c.id)>=0,lg=logged?logFor(c.id,dn):null,st;
  if(logged&&lg){
    var t='<span class="stt done'+(lg.fit==='no'?' no':'')+'">'+CHK+(lg.fit==='yes'?'合っていた':'合わなかった')+'</span>';
    st=VIEW?t:'<button class="stt done'+(lg.fit==='no'?' no':'')+'" data-a="rec-open" data-id="'+c.id+'" data-d="'+dn+'">'+CHK+(lg.fit==='yes'?'合っていた':'合わなかった')+'</button>';
  }else if(isFut){st='<span class="stt plan">予定</span>';}
  else if(VIEW){st='<span class="stt plan">未記録</span>';}
  else st='<button class="stt todo" data-a="rec-open" data-id="'+c.id+'" data-d="'+dn+'">記録する</button>';
  var tapId='<button class="tx" data-a="open-card" data-id="'+c.id+'" style="text-align:left"><div class="k">'+CATS[c.category].label+'</div><div class="tt">'+esc(c.title)+'</div></button>';
  return '<div class="trow cat-'+c.category+(logged?' isdone':'')+'"><div class="ic">'+img('category_'+c.category)+'</div>'+tapId+st+'</div>';
}

/* day type / pick / adjust */

   '<button class="dtcard" data-a="daytype" data-v="tight"><span class="face">'+img('daytype_tight')+'</span><span><div class="t">余裕がない日</div><div class="d">短い時間や、<br>小さな形でできるものから出します</div></span></button>'+
   '<button class="dtcard" data-a="daytype" data-v="free"><span class="face">'+img('daytype_free')+'</span><span><div class="t">余裕がある日</div><div class="d">じっくり試せるものから出します</div></span></button>';
};
V.pick=function(){

   '<div class="cards tight">'+grid+'</div><button class="link" style="margin-top:38px" data-a="no-card">'+w+'は取り組めそうなカードがない</button>'+
   '<div class="foot bar"><div class="barrow"><div class="cnt"><div class="a">選んだカード</div><div class="b">'+sel.length+'枚</div></div>'+btn(w+'はこれにする','pick-confirm',{id:'primary',off:!sel.length})+'</div></div>';
};
V.pick.valid=function(){return peek(ui.tgt||realNo()).selected.length>0;};

V.adjust=function(){

  var rows=list.map(function(h){
    var on=ui.adj===h.k,d=h.d==='__OTHERDAY__'?((oc&&oc.dayType==='free')?'余裕がない日':'余裕がある日')+'にも、できる形は？':h.d;
    return '<button class="arow opt'+(on?' on':'')+'" data-a="adj-sel" data-v="'+h.k+'"><span class="ic">'+img((fit?'fh_':'hint_')+h.k)+'</span><span><div class="tt">'+h.t+'</div><div class="dd">'+esc(d)+'</div></span></button>';}).join('');

V.adjust.valid=function(){return !!ui.adj;};

/* record */
function recDraft(id,rdn){
  ui.rec=ui.rec||{};var key=rdn+':'+id;
  if(!ui.rec[key]){
    var c=cardById(id),old=logFor(id,rdn);
    ui.rec[key]=old?{fit:old.fit,reasons:(old.reasons||[]).slice(),note:old.note||'',actual:old.actualText||'',changed:(old.changedHow||[]).slice(),logId:old.id,planned:old.plannedTitle||(c?c.title:'')}
      :{fit:null,reasons:[],note:'',actual:'',changed:[],logId:null,planned:c?c.title:''};
  }
  return ui.rec[key];
}
function curRec(){var e=peek(ui.rdn),id=e.selected[ui.ridx||0];return {e:e,id:id,c:cardById(id),d:id?recDraft(id,ui.rdn):null};}
function targetCard(c,label){return '<div class="tcard" style="--c1:'+CATS[c.category].color+'"><span class="ico">'+img('category_'+c.category,0.8)+'</span><span><div class="a">'+label+' ・ '+CATS[c.category].label+'</div><div class="b">'+esc(c.title)+'</div></span></div>';}
V.record=function(){
  var r=curRec(),c=r.c,d=r.d,n=r.e.selected.length;if(!c)return nav('')+'<p class="nolog">カードが見つかりません。</p>';
  var w=wordOf(ui.rdn),i=ui.ridx||0;
  var otherLeft=r.e.selected.some(function(id,j){return j!==i&&r.e.logged.indexOf(id)<0;});
  var fitCards=[['yes','合っている','fit_yes'],['no','合っていない','fit_no']].map(function(x){var on=d.fit===x[0];
    return '<button class="fit opt'+(on?' on':'')+'" data-a="fit" data-v="'+x[0]+'"><span class="tick">'+TICKW+'</span><span class="fi">'+img(x[2],0.8)+'</span>'+x[1]+'</button>';}).join('');
  var fix=d.fit?'<div class="fixbox"><div class="p">'+(d.fit==='yes'?'新しい形も考えてみませんか？':'合っていない時は、形を変えてみませんか？')+'</div><button class="btn sm" data-a="rec-hints">手がかりを見る'+ARROW+'</button></div>':'';
  var reasons='';
  if(d.fit==='no'){
    reasons='<div class="h2">なんでそう感じましたか？ <span class="badge">任意</span></div><div class="h2s">近いものを、いくつでも選べます</div><div class="rgrid">'+
     REASONS.map(function(x){var on=d.reasons.indexOf(x.k)>=0;return '<button class="ropt'+(on?' on':'')+'" data-a="reason" data-v="'+x.k+'"><div class="tt">'+x.t+'</div><div class="dd">'+esc(x.d)+'</div></button>';}).join('')+'</div>';
  }
  return nav((i+1)+' / '+n+'枚目')+'<h1 class="h24">'+w+'の記録</h1>'+targetCard(c,'カード'+(i+1))+
   '<div class="qrow"><h2>このやり方は、<br>自分に合っていましたか？</h2><span class="badge req">必須</span></div><div class="fitgrid">'+fitCards+'</div>'+fix+reasons+
   '<div class="h2" style="margin-top:22px">ひとこと <span class="badge">任意</span></div><input class="field" data-bind="rnote" style="border-color:var(--bd2)" maxlength="140" placeholder="気づいたことがあれば、書いてみてください" value="'+esc(d.note)+'" autocomplete="off">'+
   '<button class="link" style="margin-top:20px;text-align:left;font-size:13px;padding-left:0" data-a="rec-plan-actual">'+w+'だけ、やり方が予定と違いましたか？(任意)</button>'+
   '<div class="foot bar">'+btn(otherLeft?'次のカードの記録へ'+ARROW:'記録を終える','rec-next',{id:'primary',off:!d.fit})+'</div>';
};
V.record.valid=function(){var r=curRec();return !!(r.d&&r.d.fit);};

V.paction=function(){
  var r=curRec(),c=r.c,d=r.d,n=r.e.selected.length,w=wordOf(ui.rdn),i=ui.ridx||0;if(!c)return '';
  var rows=HINTS.map(function(h){var on=d.changed.indexOf(h.k)>=0;return '<button class="arow plain opt'+(on?' on':'')+'" data-a="pa-hint" data-v="'+h.k+'" style="margin-bottom:12px"><div class="tt">'+h.t+'</div><div class="dd">'+esc(h.done)+'</div></button>';}).join('');
  return nav((i+1)+' / '+n+'枚目')+'<h1 class="h24" style="margin-top:6px">'+w+'のやり方を<br>書き残す</h1><p class="sub">予定と違った日も、大切な記録です。</p>'+targetCard(c,'カード'+(i+1))+
   '<div class="h2" style="margin-top:22px">予定していたこと</div><div style="background:var(--chip);border-radius:24px;padding:13px 20px;font-size:15px;line-height:22px">'+esc(c.title)+'</div>'+
   '<div class="h2" style="margin-top:22px">実際にやったこと</div><input class="field" data-bind="actual" style="border-color:var(--bd)" maxlength="140" placeholder="例:家の中で5分ストレッチした" value="'+esc(d.actual)+'" autocomplete="off">'+
   '<div class="h2" style="margin-top:22px">どう変えましたか？ <span class="badge">任意</span></div><div class="h2s">近いものを、いくつでも選べます</div>'+rows+
   '<p class="sub" style="font-size:12px;line-height:21px;margin-top:6px">'+w+'だけの変更は、この記録に残ります。<br>これからもこの形でやりたい時は、新しいカードにできます。</p>'+
   '<div class="foot bar">'+btn('保存して、記録にもどる','pa-save')+'</div>';
};

/* card detail */
function hintLabel(k){var a=HINTS.concat(FHINTS).filter(function(x){return x.k===k;})[0];return a?a.t:'―';}
V.card=function(){
  var c=cardById(ui.cardId);if(!c)return nav('')+'<p class="nolog">カードが見つかりません。</p>';
  var logs=S.logs.filter(function(l){return l.cardId===c.id;}).sort(function(a,b){return a.savedAt-b.savedAt;});
  var front='<div class="face-side"><div class="hd">'+CATS[c.category].label+'</div><div class="bd"><div class="bigico">'+img('category_'+c.category,1.7)+'</div><div class="bigttl">'+esc(c.title)+'</div><div class="dash"></div><div class="meta"><div class="k">どんな日に向いている？</div><div class="v"><span class="tag">'+DT[c.dayType]+'</span></div>'+(c.source?'<div class="k" style="margin-top:14px">どこで知った？</div><div class="v">'+esc(c.source)+'</div>':'')+'</div></div></div>';
  var rows=logs.map(function(l){
    var rs=(l.fit==='no'?(l.reasons||[]):[]).map(function(k){var r=REASONS.filter(function(x){return x.k===k;})[0];return r?r.t:'';}).filter(Boolean).join('・');
    var txt=[];if(l.note)txt.push(esc(l.note));if(l.actualText)txt.push('実際:'+esc(l.actualText));
    return '<div class="logrow"><div class="l1"><span>'+l.dayNo+'日目</span><span class="pl" style="background:'+(l.fit==='yes'?'var(--ok)':'var(--ng)')+'">'+(l.fit==='yes'?'合っている':'合っていない')+'</span>'+(rs?'<span>'+rs+'</span>':'')+'</div>'+(txt.length?'<div class="l2">'+txt.join('<br>')+'</div>':'')+'</div>';}).join('');
  var origin='';
  if(c.parentId){var p=cardById(c.parentId);
    origin='<div class="origin"><div class="a">元のカード</div><div class="b">「'+esc(p?p.title:'(元のカード)')+'」から変えました</div><div class="c">変えたところ:'+hintLabel((c.changeTypes||[])[0])+(c.changeReason?' / 理由:'+esc(c.changeReason):'')+'</div></div>';}
  var back='<div class="face-side rear"><div class="hd">記録</div><div class="bd"><div class="logs"><div class="bt">'+esc(c.title)+'</div>'+(rows||'<div class="nolog">まだ記録がありません。</div>')+origin+'</div></div></div>';
  return vbar()+nav('')+'<h1 class="h24">カードの記録</h1><p class="sub">カードをタップすると、裏返って記録が見られます</p>'+
   '<div class="flipwrap cat-'+c.category+'"><div class="flipper'+(ui.flip?' on':'')+'" id="flipper" data-a="flip" role="button" tabindex="0">'+front+back+'</div></div>'+
   '<button class="flipbtn" data-a="flip">'+(ui.flip?'おもてを見る':'記録を見る')+'</button>';
};

/* trash */
V.trash=function(){
  var tl=trashedCards(),sub=ui.tsub||'pick',sel=ui.tsel||{};
  var head=vbar()+'<div class="thead"><button class="tb" data-a="back" aria-label="もどる">'+CHEV+'</button><h1>ゴミ箱</h1></div>'+
   '<div class="seg"><button class="'+(sub==='pick'?'on':'')+'" data-a="trash-seg" data-v="pick">捨てるカードを選ぶ</button><button class="'+(sub==='in'?'on':'')+'" data-a="trash-seg" data-v="in">ゴミ箱の中<span class="n">'+tl.length+'</span></button></div>';

    return head+'<p class="note2">捨てたいカードを選んでください。<br>捨てても、記録は残ります。ゴミ箱から、いつでも戻せます。</p>'+(rows||'<div class="empty2">捨てられるカードがありません。</div>')+
     (VIEW?'':'<div class="actbar"><button data-a="trash-do" '+(k?'':'disabled')+'>'+(k?img('trash',0.9)+k+'枚をゴミ箱に入れる':'カードを選んでください')+'</button></div>');

  return head+'<p class="note2">捨てたカードの中身です。'+(VIEW?'':'「もどす」を押すと、手札に戻ります。')+'</p>'+(tl.length?rows2:'<div class="empty2">ゴミ箱は、空です。</div>');
};

/* backup / finish / restore / viewer */
function bkTexts(){

function logsCSV(){
  var rows=[['日目','日付','カード','カテゴリ','向いている日','合っていたか','理由','ひとこと','予定していたこと','実際にやったこと','変えたところ']];
  S.logs.slice().sort(function(a,b){return a.dayNo-b.dayNo||a.savedAt-b.savedAt;}).forEach(function(l){
    var c=cardById(l.cardId)||{};
    rows.push([l.dayNo,l.date||'',c.title||'',c.category?CATS[c.category].label:'',c.dayType?DT[c.dayType]:'',l.fit==='yes'?'合っている':'合っていない',(l.fit==='no'?(l.reasons||[]):[]).map(function(k){var r=REASONS.filter(function(x){return x.k===k;})[0];return r?r.t:k;}).join('/'),l.note||'',l.plannedTitle||'',l.actualText||'',(l.changedHow||[]).map(function(k){return hintLabel(k);}).join('/')]);
  });
  return rows.map(function(r){return r.map(function(c){c=String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',');}).join('\n');
}

  var c={id:uid(),title:draft.title.trim(),category:draft.cat,dayType:draft.dayType,source:draft.source.trim(),createdAt:Date.now(),createdDayNo:realNo(),parentId:draft.parentId||null,changeTypes:draft.hint?[draft.hint]:[],changeReason:draft.reasonText||'',trashed:false};
  S.cards.push(c);save();

  return c;
}
function saveRecord(id,rdn){
  var d=recDraft(id,rdn),e=ent(rdn);if(!d.fit)return false;
  var rec={id:d.logId||uid(),cardId:id,date:dayDate(rdn).key,dayNo:rdn,todayDayType:e.dayType,fit:d.fit,reasons:d.fit==='no'?d.reasons.slice():[],note:d.note.trim(),plannedTitle:d.planned,actualText:d.actual.trim(),changedHow:d.changed.slice(),savedAt:Date.now()};
  var found=false;for(var i=0;i<S.logs.length;i++){if(S.logs[i].id===rec.id){S.logs[i]=rec;found=true;}}
  if(!found)S.logs.push(rec);
  d.logId=rec.id;
  if(e.logged.indexOf(id)<0)e.logged.push(id);
  save();ev('log_save',{day:rdn,fit:rec.fit,reasons:rec.reasons,note:rec.note,actual:rec.actualText,changed:rec.changedHow},id);

    box.innerHTML='<div class="box"><h3>裏のパネル(研究者用) '+VERSION+'</h3><div>ニックネーム:'+esc(S.user?S.user.nickname:'―')+' / 手札 '+S.cards.length+'枚 / 記録 '+S.logs.length+'件 / 開始日 '+esc(startDate())+'</div>'+

     '<textarea id="dbg-out" readonly placeholder="ここに出ます"></textarea>'+
     '<div class="row"><button class="b" data-d="copy">コピー</button><button class="b dg" data-d="wipe">データを全部消す</button><button class="b" data-d="close">閉じる</button></div><div id="dbg-msg"></div></div>';
  }
  paint();l.appendChild(box);
  box.addEventListener('click',function(e){
    var el=e.target.closest('[data-d]');
    if(e.target===box){box.remove();render();return;}
    if(!el)return;var d=el.getAttribute('data-d');

    if(d==='inc'||d==='dec'){S.dayOffset=(S.dayOffset||0)+(d==='inc'?1:-1);save();paint();return;}

    if(d==='csv'||d==='json'){var o=box.querySelector('#dbg-out');o.value=d==='csv'?logsCSV():JSON.stringify(S,null,1);o.focus();o.select();return;}
    if(d==='copy'){var o2=box.querySelector('#dbg-out');o2.select();var m=box.querySelector('#dbg-msg');
      try{navigator.clipboard.writeText(o2.value).then(function(){m.textContent='コピーしました。';},function(){m.textContent='選択しました。長押しでコピーしてください。';});}catch(er){m.textContent='選択しました。長押しでコピーしてください。';}return;}
    if(d==='wipe'){
      if(!el.dataset.sure){el.dataset.sure='1';el.textContent='もう一度押すと全部消えます';return;}
      S=blank();try{localStorage.removeItem(KEY);}catch(er){}box.remove();ui={};draft=blankDraft();reset('welcome');return;
    }
  });
}

/* ---------- start ---------- */
(function init(){
  if(VIEW)screen='vstart';
  else if(!S.user)screen='welcome';
  else if(!(S.flags&&S.flags.tutDone)&&liveCards().length===0){screen='tutorial';ui.tut=0;}
  else if(liveCards().length<5&&realNo()===1&&!(S.flags&&S.flags.setupDone))screen='setup';
  else screen='home';
  dir='fwd';render(true);
})();
window.__kenko={S:function(){return S;},go:go,reset:reset,ui:function(){return ui;}};
})();

</script>
